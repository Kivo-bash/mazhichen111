<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>火种到星辰</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@700;900&family=Noto+Sans+SC:wght@400;500&family=JetBrains+Mono:wght@500&family=Ma+Shan+Zheng&display=swap">
<style>
:root{
  color-scheme:dark;
  --ink:#08090e;
  --bone:#f1ead8;
  --dim:#b4ab96;
  --accent:#ff8a3d;
  --serif:"Noto Serif SC","Songti SC","SimSun",serif;
  --sans:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
html,body{height:100%;margin:0;background:var(--ink);color:var(--bone);overflow:hidden}
body{font-family:var(--sans);-webkit-font-smoothing:antialiased}
#stage{position:fixed;inset:0;background:var(--ink)}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
.shade{position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(120% 70% at 0% 0%,rgba(4,5,10,.62),rgba(4,5,10,0) 55%),
             linear-gradient(to top,rgba(4,5,10,.7),rgba(4,5,10,0) 22%)}
.brand{position:absolute;top:calc(env(safe-area-inset-top,0px) + 22px);right:24px;
  display:flex;align-items:baseline;gap:12px;font-family:var(--mono);font-size:12px;
  letter-spacing:.14em;color:var(--dim);text-transform:uppercase}
.brand b{font-family:var(--serif);font-weight:900;font-size:15px;letter-spacing:.2em;color:var(--bone)}
.caption{position:absolute;top:calc(env(safe-area-inset-top,0px) + 56px);left:clamp(16px,4vw,48px);
  max-width:min(34rem,calc(100% - 32px));text-shadow:0 2px 18px rgba(0,0,0,.55)}
.caption .era{font-family:var(--mono);font-size:13px;letter-spacing:.16em;color:var(--accent);
  display:flex;gap:14px;align-items:center}
.caption .era i{font-style:normal;color:var(--dim)}
.caption h1{font-family:var(--serif);font-weight:900;font-size:clamp(2.1rem,5.4vw,3.9rem);
  line-height:1.1;margin:.3em 0 .35em;letter-spacing:.06em;text-wrap:balance}
.caption p{margin:0;font-size:clamp(.95rem,1.5vw,1.08rem);line-height:1.8;color:rgba(241,234,216,.88);max-width:30em}
.caption.in .era,.caption.in h1,.caption.in p{animation:rise .9s cubic-bezier(.2,.7,.2,1) both}
.caption.in h1{animation-delay:.08s}
.caption.in p{animation-delay:.18s}
@keyframes rise{from{opacity:0;transform:translateY(14px);filter:blur(4px)}to{opacity:1;transform:none;filter:none}}

.intro,.finale{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding-inline:16px;pointer-events:none}
.intro .k,.finale .k{font-family:var(--mono);font-size:13px;letter-spacing:.3em;color:var(--accent)}
.intro h2{font-family:var(--serif);font-weight:900;font-size:clamp(3rem,11vw,7.5rem);margin:.15em 0 .1em;letter-spacing:.12em;
  text-shadow:0 0 60px rgba(255,138,61,.35)}
.intro p{margin:0;color:var(--dim);font-size:1.05rem;letter-spacing:.2em}
.finale{background:radial-gradient(60% 50% at 50% 50%,rgba(5,4,15,.55),rgba(5,4,15,0))}
.finale h2{font-family:var(--serif);font-weight:900;font-size:clamp(2rem,6.4vw,4.6rem);margin:.3em 0 .6em;letter-spacing:.1em;text-wrap:balance}
.finale button{pointer-events:auto}

.btn{appearance:none;border:1px solid rgba(241,234,216,.35);background:rgba(8,9,14,.45);color:var(--bone);
  font:500 14px/1 var(--sans);letter-spacing:.2em;padding:12px 22px;border-radius:999px;cursor:pointer;
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn:focus-visible,.play:focus-visible,.chap:focus-visible,.track:focus-visible{outline:2px solid var(--accent);outline-offset:3px}

.bar{position:absolute;left:0;right:0;bottom:0;display:flex;align-items:center;gap:16px;
  padding:14px clamp(16px,4vw,48px) calc(env(safe-area-inset-bottom,0px) + 18px)}
.play{flex:none;width:44px;height:44px;border-radius:50%;border:1px solid rgba(241,234,216,.4);
  background:rgba(8,9,14,.5);color:var(--bone);display:grid;place-items:center;cursor:pointer;padding:0}
.play:hover{border-color:var(--accent)}
.play svg{width:16px;height:16px;fill:currentColor}
.track{position:relative;flex:1;height:44px;cursor:pointer;touch-action:none}
.rail{position:absolute;left:0;right:0;top:14px;height:3px;background:rgba(241,234,216,.18);border-radius:2px}
.fill{position:absolute;left:0;top:14px;height:3px;background:var(--accent);border-radius:2px;width:0}
.knob{position:absolute;top:10px;width:11px;height:11px;margin-left:-5.5px;border-radius:50%;background:var(--bone);
  box-shadow:0 0 0 4px rgba(0,0,0,.25)}
.chap{position:absolute;top:0;height:44px;transform:translateX(-50%);background:none;border:0;padding:0 4px;
  color:var(--dim);font:500 11px/1 var(--sans);letter-spacing:.08em;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:0}
.chap::before{content:"";width:1px;height:9px;margin-top:11px;background:rgba(241,234,216,.45)}
.chap span{margin-top:9px;white-space:nowrap}
.chap.on{color:var(--bone)}
.chap.on::before{background:var(--accent)}
.time{flex:none;font-family:var(--mono);font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums;letter-spacing:.05em}
@media (max-width:760px){
  .chap span{display:none}
  .chap.on span{display:block}
  .time{display:none}
  .brand span{display:none}
}
@media (max-width:420px){
  .caption p{font-size:.92rem}
}
</style>
</head>
<body>
<div id="stage">
  <canvas id="cv" aria-label="人类科技发展史动画：从钻木取火到智能时代"></canvas>
  <div class="shade"></div>
  <div class="brand"><b>火种到星辰</b><span id="chapNo">01 / 10</span></div>
  <section class="caption in" id="cap" aria-live="polite">
    <div class="era"><span id="capEra">约 40 万年前</span><i id="capIdx">第 1 章</i></div>
    <h1 id="capTitle">钻木取火</h1>
    <p id="capText"></p>
  </section>
  <div class="intro" id="intro">
    <div class="k">人类科技简史 · 90 秒</div>
    <h2>火种到星辰</h2>
    <p>从第一簇火光，到智能与星海</p>
  </div>
  <div class="finale" id="finale" hidden>
    <div class="k">未完待续</div>
    <h2>从一粒火星，到满天星辰</h2>
    <button class="btn" id="replay" type="button">重新播放</button>
  </div>
  <nav class="bar">
    <button class="play" id="play" type="button" aria-label="暂停"></button>
    <div class="track" id="track" tabindex="0" role="slider" aria-label="播放进度" aria-valuemin="0" aria-valuemax="90" aria-valuenow="0">
      <div class="rail"></div><div class="fill" id="fill"></div><div class="knob" id="knob"></div>
    </div>
    <span class="time" id="time">00:00 / 01:30</span>
  </nav>
</div>

<script>
(()=>{
"use strict";
/* ============ 工具函数 ============ */
const TAU=Math.PI*2;
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const eo=t=>1-Math.pow(1-t,3);
const back=t=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2);};
const seg=(p,a,b)=>clamp((p-a)/(b-a));
const hash=n=>{const s=Math.sin(n*127.1+311.7)*43758.5453;return s-Math.floor(s);};
const noise1=x=>{const i=Math.floor(x),f=x-i,u=f*f*(3-2*f);return lerp(hash(i),hash(i+1),u);};
const fbm=x=>noise1(x)*.65+noise1(x*2.3+7)*.25+noise1(x*5.1+3)*.1;
const hex=h=>{const n=parseInt(h.slice(1),16);return[n>>16&255,n>>8&255,n&255];};
const rgba=(h,a)=>{const[r,g,b]=hex(h);return`rgba(${r},${g},${b},${a})`;};
const mix=(h1,h2,t)=>{const a=hex(h1),b=hex(h2);return`rgb(${a.map((v,i)=>Math.round(lerp(v,b[i],t))).join(",")})`;};

function vgrad(c,y0,y1,stops){const g=c.createLinearGradient(0,y0,0,y1);for(const[o,col]of stops)g.addColorStop(o,col);return g;}
function glow(c,x,y,r,col,a){if(r<=0||a<=0)return;const g=c.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,rgba(col,a));g.addColorStop(1,rgba(col,0));c.fillStyle=g;c.fillRect(x-r,y-r,2*r,2*r);}
function stars(c,W,H,n,a,t,seed=1){
  if(a<=0)return;
  for(let i=0;i<n;i++){
    const x=hash(i*3.1+seed)*W,y=hash(i*7.7+seed*2)*H,r=hash(i*11.3+seed)*1.4+.3;
    const tw=.45+.55*Math.sin(t*(1.5+hash(i)*2)+i);
    c.fillStyle=`rgba(255,250,235,${a*(.35+.65*tw)})`;
    c.beginPath();c.arc(x,y,r,0,TAU);c.fill();
  }
}
function ridge(c,W,H,base,amp,freq,seed,col,off=0){
  c.fillStyle=col;c.beginPath();c.moveTo(0,H);
  for(let x=0;x<=W+24;x+=12)c.lineTo(x,base-fbm((x+off)*freq+seed)*amp);
  c.lineTo(W,H);c.closePath();c.fill();
}
function pine(c,x,y,h,col){
  c.fillStyle=col;c.beginPath();
  for(let k=0;k<3;k++){const yy=y-h*.25-k*h*.22,w=h*(.32-k*.07);c.moveTo(x-w,yy);c.lineTo(x,yy-h*.4);c.lineTo(x+w,yy);}
  c.fill();c.fillRect(x-h*.03,y-h*.3,h*.06,h*.3);
}
function cloud(c,x,y,s,col,a){
  c.fillStyle=rgba(col,a);c.beginPath();
  [[0,0,1],[.8,.15,.75],[-.8,.2,.7],[.35,-.35,.7],[-.35,-.25,.6],[1.4,.35,.45],[-1.4,.35,.45]].forEach(([dx,dy,r])=>{c.moveTo(x+dx*s+r*s,y+dy*s);c.arc(x+dx*s,y+dy*s,r*s,0,TAU);});
  c.fill();
}
function wheel(c,x,y,r,ang,col,spokes=8,w=5,hub){
  c.save();c.translate(x,y);c.rotate(ang);c.strokeStyle=col;c.lineWidth=w;
  c.beginPath();c.arc(0,0,r,0,TAU);c.stroke();
  c.lineWidth=Math.max(1.2,w*.5);c.beginPath();
  for(let i=0;i<spokes;i++){const a=i/spokes*TAU;c.moveTo(0,0);c.lineTo(Math.cos(a)*r,Math.sin(a)*r);}
  c.stroke();c.fillStyle=hub||col;c.beginPath();c.arc(0,0,r*.2,0,TAU);c.fill();c.restore();
}
function gear(c,x,y,r,teeth,ang,col,w){
  c.save();c.translate(x,y);c.rotate(ang);c.strokeStyle=col;c.lineWidth=w;c.beginPath();
  for(let i=0;i<teeth*2;i++){
    const a0=i/(teeth*2)*TAU,a1=(i+1)/(teeth*2)*TAU,rr=i%2?r:r*1.12;
    c.lineTo(Math.cos(a0)*rr,Math.sin(a0)*rr);c.lineTo(Math.cos(a1)*rr,Math.sin(a1)*rr);
  }
  c.closePath();c.stroke();
  c.beginPath();c.arc(0,0,r*.25,0,TAU);c.stroke();
  for(let i=0;i<5;i++){const a=i/5*TAU;c.beginPath();c.moveTo(Math.cos(a)*r*.25,Math.sin(a)*r*.25);c.lineTo(Math.cos(a)*r*.85,Math.sin(a)*r*.85);c.stroke();}
  c.restore();
}
function flame(c,x,y,sz,t,a=1){
  if(sz<=.5)return;
  c.save();c.globalCompositeOperation="lighter";
  const layers=[["#ff3d00",1],["#ff8a1a",.74],["#ffd35a",.48],["#fff6dc",.24]];
  for(const[col,k]of layers){
    for(let j=-1;j<=1;j++){
      const h=sz*k*(1+.22*Math.sin(t*9+j*2+k*5)+.35*(noise1(t*4+j*10+k*3)-.5))*(j===0?1:.72);
      const w=sz*k*.36*(j===0?1:.7),ox=x+j*sz*.2*k,sw=Math.sin(t*6+j*1.7)*sz*.1;
      c.beginPath();c.moveTo(ox-w,y);
      c.bezierCurveTo(ox-w*1.2,y-h*.45,ox+sw-w*.2,y-h*.7,ox+sw,y-h);
      c.bezierCurveTo(ox+sw+w*.2,y-h*.7,ox+w*1.2,y-h*.45,ox+w,y);
      c.closePath();c.fillStyle=rgba(col,.5*a);c.fill();
    }
  }
  c.restore();
}
function flameDown(c,x,y,w,len,t){
  c.save();c.globalCompositeOperation="lighter";
  const layers=[["#ff5a1a",1],["#ffb347",.7],["#fff1c9",.4]];
  for(const[col,k]of layers){
    const L=len*k*(1+.15*Math.sin(t*40+k*9)+.2*(noise1(t*12+k*4)-.5)),ww=w*(.6+k*.4);
    c.beginPath();c.moveTo(x-ww,y);
    c.bezierCurveTo(x-ww*1.1,y+L*.4,x-ww*.3,y+L*.8,x,y+L);
    c.bezierCurveTo(x+ww*.3,y+L*.8,x+ww*1.1,y+L*.4,x+ww,y);
    c.closePath();c.fillStyle=rgba(col,.75);c.fill();
  }
  c.restore();
}

/* ============ 人物（剪影骨架 + 反向动力学） ============ */
function ik(ox,oy,tx,ty,l,mode){
  let dx=tx-ox,dy=ty-oy,d=Math.hypot(dx,dy);const m=l*2*.999;
  if(d>m){tx=ox+dx/d*m;ty=oy+dy/d*m;d=m;}
  d=Math.max(d,1e-3);
  const a=Math.atan2(ty-oy,tx-ox),h=Math.acos(clamp(d/(2*l),-1,1));
  const e1=[ox+Math.cos(a+h)*l,oy+Math.sin(a+h)*l],e2=[ox+Math.cos(a-h)*l,oy+Math.sin(a-h)*l];
  const e=mode==="fwd"?(e1[0]>e2[0]?e1:e2):(e1[1]>e2[1]?e1:e2);
  return[e,[tx,ty]];
}
function limb(ox,oy,spec,l,mode){
  if(spec.t)return[[ox,oy],...ik(ox,oy,spec.t[0],spec.t[1],l,mode)];
  const[a1,a2]=spec,k=[ox+Math.sin(a1)*l,oy+Math.cos(a1)*l];
  return[[ox,oy],k,[k[0]+Math.sin(a1+a2)*l,k[1]+Math.cos(a1+a2)*l]];
}
function figure(c,x,y,s,P,col,dir=1,alpha=1){
  if(alpha<=0)return;
  c.save();c.translate(x,y);c.scale(dir,1);c.globalAlpha*=alpha;
  c.strokeStyle=c.fillStyle=col;c.lineCap=c.lineJoin="round";
  const T=s*.34,U=s*.19,L=s*.25,lw=s*.07,lean=P.lean||0;
  const sx=Math.sin(lean)*T,sy=-Math.cos(lean)*T;
  const draw=(pts,w)=>{c.lineWidth=w;c.beginPath();c.moveTo(...pts[0]);c.lineTo(...pts[1]);c.lineTo(...pts[2]);c.stroke();};
  draw(limb(0,0,P.ll||[.1,0],L,"fwd"),lw*1.15);
  draw(limb(sx,sy,P.la||[.2,.3],U,"down"),lw*.85);
  c.lineWidth=lw*1.8;c.beginPath();c.moveTo(0,0);c.lineTo(sx,sy);c.stroke();
  const hl=lean+(P.head||0),hx=sx+Math.sin(hl)*s*.12,hy=sy-Math.cos(hl)*s*.12;
  c.beginPath();c.arc(hx,hy,s*.078,0,TAU);c.fill();
  draw(limb(0,0,P.rl||[-.1,0],L,"fwd"),lw*1.15);
  draw(limb(sx,sy,P.ra||[-.2,.3],U,"down"),lw*.85);
  if(P.extra)P.extra(c,{sx,sy,hx,hy,s});
  c.restore();
}
function walk(ph,amp=1){
  return{
    ll:[.42*amp*Math.sin(ph),-.7*amp*Math.max(0,Math.sin(ph+1.9))],
    rl:[-.42*amp*Math.sin(ph),-.7*amp*Math.max(0,Math.sin(ph+1.9+Math.PI))],
    la:[-.35*amp*Math.sin(ph),.35],ra:[.35*amp*Math.sin(ph),.35]
  };
}

/* ============ 第 1 章：钻木取火 ============ */
function sFire(c,t,p,W,H){
  const cx=W/2,gy=H*.74,fx=cx+40;
  const f=ease(seg(p,.42,.66)),q=ease(seg(p,.55,.72));
  c.fillStyle=vgrad(c,0,gy,[[0,"#04050c"],[.65,"#12122c"],[1,"#2a1c30"]]);c.fillRect(0,0,W,H);
  stars(c,W,gy*.9,180,.9,t,3);
  const mx=W*.82,my=H*.16;glow(c,mx,my,140,"#b9b6ff",.14);
  c.fillStyle="#ece6cf";c.beginPath();c.arc(mx,my,24,0,TAU);c.fill();
  c.fillStyle="rgba(4,5,12,.9)";c.beginPath();c.arc(mx+11,my-5,21,0,TAU);c.fill();
  ridge(c,W,H,gy-70,130,.004,11,"#0f1022");
  for(let i=0;i<9;i++){const x=hash(i*5)*W;if(Math.abs(x-fx)<220)continue;pine(c,x,gy-20+hash(i)*20,90+hash(i*2)*90,"#0b0b17");}
  ridge(c,W,H,gy-8,40,.01,23,"#0b0a13");
  c.fillStyle="#0a0810";c.fillRect(0,gy,W,H-gy);
  if(f>0){
    c.save();c.globalCompositeOperation="lighter";
    glow(c,fx,gy-40,620*f,"#ff6a1a",.28*f);
    c.translate(fx,gy);c.scale(1,.22);glow(c,0,0,520,"#ff8a2a",.55*f);
    c.restore();
  }
  // 烟
  const sm=seg(p,.1,.35)*(1-seg(p,.66,.9)*.7);
  for(let i=0;i<22;i++){
    const ph=(t*.32+hash(i*2))%1,x=fx+Math.sin(ph*6+i)*18*ph+ph*30,y=gy-8-ph*190,r=6+ph*30;
    c.fillStyle=`rgba(190,175,165,${.16*(1-ph)*sm})`;c.beginPath();c.arc(x,y,r,0,TAU);c.fill();
  }
  // 柴堆
  if(q>0){
    c.save();c.globalAlpha=q;c.strokeStyle="#3a2414";c.lineCap="round";c.lineWidth=11;
    c.beginPath();c.moveTo(fx-46,gy-2);c.lineTo(fx+40,gy-18);c.moveTo(fx-40,gy-18);c.lineTo(fx+46,gy-2);c.stroke();
    c.restore();
  }
  // 钻木工具
  const tool=1-q;
  const bx=fx-58+20*Math.sin(t*10),by=gy-40;
  if(tool>0){
    c.save();c.globalAlpha=tool;
    c.fillStyle="#3a2616";c.fillRect(fx-42,gy-8,84,8);
    c.fillStyle="#7a5230";c.fillRect(fx-3,gy-74,6,66);
    c.fillStyle="#3a2414";const sh=(t*140)%10;
    for(let k=0;k<7;k++){const yy=gy-74+((k*10+sh*Math.sign(Math.cos(t*10)))%66+66)%66;c.fillRect(fx-3,yy,6,2);}
    c.fillStyle="#2a1a10";c.fillRect(fx-10,gy-80,20,6);
    c.strokeStyle="#5a3a20";c.lineWidth=4;c.beginPath();c.moveTo(bx,by);c.quadraticCurveTo(bx+60,by-30,bx+120,by);c.stroke();
    c.strokeStyle="rgba(220,200,170,.6)";c.lineWidth=1;c.beginPath();c.moveTo(bx,by);c.lineTo(fx-3,by+3);c.lineTo(fx+3,by-3);c.lineTo(bx+120,by);c.stroke();
    c.restore();
  }
  // 火星
  const sp=seg(p,.3,.5)*(1-seg(p,.55,.62));
  if(sp>0){c.save();c.globalCompositeOperation="lighter";
    for(let i=0;i<14;i++){const ph=(t*1.6+hash(i*9))%1,a=hash(i*13)*Math.PI+Math.PI;
      const x=fx+Math.cos(a)*ph*50,y=gy-6+Math.sin(a)*ph*40+ph*ph*30;
      c.fillStyle=`rgba(255,${160+hash(i)*80|0},60,${(1-ph)*sp})`;c.beginPath();c.arc(x,y,1.8,0,TAU);c.fill();}
    glow(c,fx,gy-6,30,"#ff9a3a",.6*sp*(.5+.5*Math.sin(t*30)));c.restore();}
  // 取火者
  const hip=[fx-70,gy-32],s=140,T=s*.34;
  const lean=lerp(.45,-.08,q),shx=Math.sin(lean)*T,shy=-Math.cos(lean)*T;
  const lh=[lerp(70,shx+18,q),lerp(-46,shy-54,q)];
  const rh=[lerp(bx-hip[0],shx+36,q),lerp(by-hip[1],shy-46,q)];

    c.fillStyle="#d9d8d2";c.beginPath();c.arc(mx,my,48,0,TAU);c.fill();
    c.fillStyle="#b6b4ac";[[-14,-10,10],[16,8,8],[-4,20,6],[12,-20,5]].forEach(([a,b,r])=>{c.beginPath();c.arc(mx+a,my+b,r,0,TAU);c.fill();});
    c.globalAlpha=1;
    const sp=seg(p,.6,.95);if(sp>0&&sp<1){const sx=lerp(-40,W+40,sp),sy=H*.34-Math.sin(sp*Math.PI)*60;
      c.strokeStyle="#cfd3da";c.lineWidth=1.2;c.beginPath();for(let k=0;k<4;k++){const a=Math.PI*.75+k*.18;c.moveTo(sx,sy);c.lineTo(sx+Math.cos(a)*40,sy+Math.sin(a)*40);}c.stroke();
      c.fillStyle="#e4e7ec";c.beginPath();c.arc(sx,sy,7,0,TAU);c.fill();
      if(Math.sin(t*10)>.6){c.strokeStyle="rgba(255,120,120,.6)";c.beginPath();c.arc(sx,sy,14,0,TAU);c.stroke();}}
  }
  // 地球弧
  const ea=seg(alt,.55,1);
  if(ea>0){const R=W*1.3,top=lerp(H+60,H*.8,ease(ea));
    c.save();c.globalCompositeOperation="lighter";c.lineWidth=18;c.strokeStyle=`rgba(90,170,255,${.35*ea})`;c.beginPath();c.arc(cx,top+R,R+6,0,TAU);c.stroke();c.restore();
    const g=c.createLinearGradient(0,top,0,H);g.addColorStop(0,"#3d8fd8");g.addColorStop(.3,"#1b4f8a");g.addColorStop(1,"#0b2244");
    c.fillStyle=g;c.beginPath();c.arc(cx,top+R,R,0,TAU);c.fill();
    c.fillStyle="rgba(255,255,255,.4)";for(let i=0;i<10;i++){c.beginPath();c.ellipse(hash(i)*W,top+30+hash(i*3)*60,40+hash(i*5)*60,6,0,0,TAU);c.fill();}}
  // 地面、发射塔
  const py=gy+sh;
  if(py<H+400){
    ridge(c,W,H,py-10,40,.006,51,"#5d7a86");
    c.fillStyle="#6b6f68";c.fillRect(0,py,W,H+sh);
    c.fillStyle="#4a4d49";c.fillRect(cx-90,py-14,180,14);
    const tx=cx+56,th=330;
    c.strokeStyle="#b8452e";c.lineWidth=3;
    c.beginPath();c.moveTo(tx,py-14);c.lineTo(tx,py-th);c.moveTo(tx+26,py-14);c.lineTo(tx+26,py-th);
    for(let y=py-14;y>py-th;y-=22){c.moveTo(tx,y);c.lineTo(tx+26,y-22);c.moveTo(tx+26,y);c.lineTo(tx,y-22);}c.stroke();
    const arm=seg(p,.18,.26);c.beginPath();c.moveTo(tx,py-240);c.lineTo(tx-lerp(34,4,arm),py-240);c.stroke();
  }
  // 火箭
  const lift=ease(seg(p,.28,.52)),ry=lerp(py-14,H*.6,lift)+(p>.2&&p<.4?(hash(Math.floor(t*40))-.5)*3:0);
  const rs=Math.min(1.1,H/680);
  const ign=seg(p,.2,.26);
  if(ign>0){
    c.save();c.globalCompositeOperation="lighter";glow(c,cx,ry+20,260*ign,"#ff8a3a",.35*ign);c.restore();
    flameDown(c,cx,ry+8*rs,16*rs,(90+120*ign)*rs,t);
  }
  rocket(c,cx,ry,rs);
  // 发射烟云
  if(p>.2&&py<H+300){
    for(let i=0;i<46;i++){const side=hash(i)<.5?-1:1,ph=clamp((t-.2*D-hash(i*3)*2.4)/5);if(ph<=0)continue;
      const x=cx+side*ph*(120+hash(i*7)*420),y=py-18-ph*(20+hash(i)*90),r=18+ph*(60+hash(i*5)*60);
      c.fillStyle=`rgba(${230-hash(i)*30|0},${222-hash(i)*30|0},${215-hash(i)*30|0},${.8*(1-ph*.5)})`;c.beginPath();c.arc(x,y,r,0,TAU);c.fill();}
  }
  // 倒计时
  if(p<.3){const lbl=p<.06?"T−3":p<.12?"T−2":p<.18?"T−1":"点火";
    c.fillStyle=`rgba(255,255,255,${.85-seg(p,.26,.3)*.85})`;c.font=`500 ${Math.round(40*rs)}px "JetBrains Mono","Noto Sans SC",monospace`;c.textAlign="left";c.textBaseline="middle";
    c.fillText(lbl,cx+120*rs,py-330*rs);}
}

/* ============ 第 10 章：智能时代 ============ */
function sAI(c,t,p,W,H){
  const cx=W/2,cy=H*.5;
  c.fillStyle=vgrad(c,0,H,[[0,"#05040f"],[1,"#0b0820"]]);c.fillRect(0,0,W,H);
  c.save();c.globalCompositeOperation="lighter";glow(c,W*.22,H*.3,W*.45,"#6b3cff",.18);glow(c,W*.8,H*.72,W*.4,"#16c7c1",.13);c.restore();
  stars(c,W,H,200,.7,t,77);
  // 火星
  const mx=W*.92,my=H*.86,mr=Math.min(160,W*.14);
  const mg=c.createRadialGradient(mx-mr*.4,my-mr*.4,mr*.1,mx,my,mr);mg.addColorStop(0,"#f08a50");mg.addColorStop(1,"#6a2412");
  c.fillStyle=mg;c.beginPath();c.arc(mx,my,mr,0,TAU);c.fill();
  c.fillStyle="rgba(90,30,15,.35)";[[-.4,-.3,.16],[.2,-.5,.1],[-.1,.1,.2]].forEach(([a,b,r])=>{c.beginPath();c.arc(mx+a*mr,my+b*mr,r*mr,0,TAU);c.fill();});
  // 环形空间站
  const sx=W*.13,sy=H*.24;
  c.save();c.translate(sx,sy);c.strokeStyle="rgba(200,215,240,.75)";c.lineWidth=6;c.beginPath();c.ellipse(0,0,70,22,0,0,TAU);c.stroke();
  c.lineWidth=2;for(let k=0;k<4;k++){const a=k/4*TAU+t*.4;c.beginPath();c.moveTo(0,0);c.lineTo(Math.cos(a)*70,Math.sin(a)*22);c.stroke();}
  for(let k=0;k<10;k++){const a=k/10*TAU+t*.4;if(Math.sin(a)>0){c.fillStyle="#ffd98a";c.fillRect(Math.cos(a)*70-2,Math.sin(a)*22-2,4,4);}}
  c.fillStyle="#dfe6f2";c.beginPath();c.arc(0,0,8,0,TAU);c.fill();c.restore();
  // 神经网络
  const layers=[4,6,8,6,3],nw=Math.min(W*.56,640),nh=Math.min(H*.46,360),gap=nh/7;
  const pos=layers.map((n,l)=>Array.from({length:n},(_,k)=>[cx-nw/2+l*nw/4,cy-(n-1)/2*gap+k*gap]));
  const la=l=>ease(seg(p,.02+l*.07,.14+l*.07));
  c.save();c.globalCompositeOperation="lighter";
  // 量子轨道
  const oa=seg(p,.35,.6);
  for(let k=0;k<3;k++){const ang=k*1.05+t*.06;c.save();c.translate(cx,cy);c.rotate(ang);
    c.strokeStyle=`rgba(160,120,255,${.25*oa})`;c.lineWidth=1.5;c.beginPath();c.ellipse(0,0,nw*.62,nw*.17,0,0,TAU);c.stroke();
    const e=t*1.3+k*2;glow(c,Math.cos(e)*nw*.62,Math.sin(e)*nw*.17,16,"#d2b8ff",oa);c.restore();}
  let e=0;
  for(let l=0;l<layers.length-1;l++){const a=Math.min(la(l),la(l+1));if(a<=0)continue;
    for(const A of pos[l])for(const B of pos[l+1]){e++;
      c.strokeStyle=`rgba(90,210,255,${.1*a})`;c.lineWidth=1;c.beginPath();c.moveTo(A[0],A[1]);c.lineTo(B[0],B[1]);c.stroke();
      if(hash(e)<.3){const s=(t*.7+hash(e*3))%1;glow(c,lerp(A[0],B[0],s),lerp(A[1],B[1],s),7,hash(e*5)>.5?"#6ff0ff":"#c49bff",.9*a);}}}
  pos.forEach((col,l)=>col.forEach(([x,y],k)=>{const a=la(l);if(a<=0)return;const act=.5+.5*Math.sin(t*3-l*1.2+k);
    glow(c,x,y,26,l%2?"#9b6bff":"#39d5ff",.45*a*act);c.fillStyle=`rgba(230,245,255,${a})`;c.beginPath();c.arc(x,y,5+act*2.5,0,TAU);c.fill();}));
  c.restore();
}

/* ============ 章节数据 ============ */
const D=9,X=1.4;
const SCENES=[
  {era:"约 40 万年前",title:"钻木取火",short:"取火",accent:"#ff8a3d",draw:sFire,
   text:"摩擦生热，第一簇人造的火光驱散了黑夜。熟食、温暖与安全，人类文明从这里开始。"},
  {era:"约公元前 8000 年",title:"农耕与车轮",short:"农耕",accent:"#f2b45a",draw:sFarm,
   text:"驯化作物与牲畜，人类定居成村；约公元前 3500 年，车轮让沉重的收获滚动起来。"},
  {era:"公元 105 年",title:"纸与印刷",short:"印刷",accent:"#e0564a",draw:sPaper,
   text:"文字留住了知识。蔡伦改进造纸，毕昇发明活字印刷，司南指向南方，思想开始大规模传播。"},
  {era:"1405 年",title:"远洋航行",short:"航海",accent:"#7cc4e8",draw:sSea,
   text:"郑和宝船七下西洋，指南针与帆船带领人类驶向未知的海域，世界第一次连成一体。"},
  {era:"1769 年",title:"蒸汽时代",short:"蒸汽",accent:"#ff9a52",draw:sSteam,
   text:"瓦特改良蒸汽机，煤与钢铁驱动工厂和火车，工业革命轰然启程。"},
  {era:"1879 年",title:"电气时代",short:"电气",accent:"#ffd27a",draw:sElectric,
   text:"从雷电中认识电，爱迪生的电灯点亮城市的夜晚，电网把能量送进千家万户。"},
  {era:"1903 年",title:"汽车与飞机",short:"交通",accent:"#8fd0ff",draw:sMotion,
   text:"内燃机让车轮飞驰，莱特兄弟完成首次动力飞行；百年后，电动汽车安静地驶向未来。"},
  {era:"1946 年",title:"信息时代",short:"信息",accent:"#5dff9e",draw:sInfo,
   text:"从 ENIAC 到互联网，晶体管与芯片把整个世界编织进同一张网络。"},
  {era:"1969 年",title:"太空时代",short:"太空",accent:"#b9c8ff",draw:sSpace,
   text:"火箭挣脱地球引力，阿波罗 11 号登上月球：个人的一小步，人类的一大步。"},
  {era:"今天与未来",title:"智能时代",short:"智能",accent:"#b28bff",draw:sAI,
   text:"人工智能、量子计算与星际探索正在展开，下一个篇章由我们共同书写。"},
];
const TOTAL=SCENES.length*D;

/* ============ 渲染与交互 ============ */
const cv=document.getElementById("cv"),ctx=cv.getContext("2d");
const buf=document.createElement("canvas"),bctx=buf.getContext("2d");
let dpr=1,sc=1,W=1100,H=760;
function resize(){
  const r=cv.getBoundingClientRect(),cw=Math.max(1,r.width),ch=Math.max(1,r.height);
  dpr=Math.min(2,window.devicePixelRatio||1);
  cv.width=buf.width=Math.round(cw*dpr);cv.height=buf.height=Math.round(ch*dpr);
  const base=cw<ch?820:1100;sc=Math.min(cw/base,ch/760);W=cw/sc;H=ch/sc;
}
window.addEventListener("resize",resize);resize();

function drawScene(c,i,t,zoom=1){
  c.setTransform(dpr*sc,0,0,dpr*sc,0,0);c.globalAlpha=1;c.globalCompositeOperation="source-over";
  c.save();
  if(zoom!==1){c.translate(W/2,H/2);c.scale(zoom,zoom);c.translate(-W/2,-H/2);}
  SCENES[i].draw(c,t,t/D,W,H);
  c.restore();
}
let T=0,playing=true,cur=-1;
const reduce=window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches;
if(reduce){playing=false;T=D*.8;}

const $=id=>document.getElementById(id);
const cap=$("cap"),intro=$("intro"),finale=$("finale"),fillEl=$("fill"),knob=$("knob"),track=$("track"),playBtn=$("play");
const ICON_PAUSE='<svg viewBox="0 0 16 16"><rect x="3" y="2" width="3.5" height="12" rx="1"/><rect x="9.5" y="2" width="3.5" height="12" rx="1"/></svg>';
const ICON_PLAY='<svg viewBox="0 0 16 16"><path d="M4 2.5v11a.6.6 0 0 0 .9.5l9-5.5a.6.6 0 0 0 0-1l-9-5.5a.6.6 0 0 0-.9.5z"/></svg>';
SCENES.forEach((s,i)=>{const b=document.createElement("button");b.type="button";b.className="chap";b.style.left=(i*D/TOTAL*100)+"%";
  b.innerHTML=`<span>${s.short}</span>`;b.setAttribute("aria-label",`跳到第 ${i+1} 章：${s.title}`);
  b.addEventListener("click",e=>{e.stopPropagation();seek(i*D+.01);});track.appendChild(b);s.btn=b;});
const fmt=s=>{s=Math.floor(s);return`${String(Math.floor(s/60)).padStart(2,"0")}:${String(s%60).padStart(2,"0")}`;};

function setScene(i){
  if(i===cur)return;cur=i;const s=SCENES[i];
  $("capEra").textContent=s.era;$("capIdx").textContent=`第 ${i+1} 章`;$("capTitle").textContent=s.title;$("capText").textContent=s.text;
  $("chapNo").textContent=`${String(i+1).padStart(2,"0")} / ${SCENES.length}`;
  document.documentElement.style.setProperty("--accent",s.accent);
  SCENES.forEach((x,k)=>x.btn.classList.toggle("on",k===i));
  cap.classList.remove("in");void cap.offsetWidth;cap.classList.add("in");
}
function updateUI(){
  const f=T/TOTAL*100;fillEl.style.width=f+"%";knob.style.left=f+"%";
  track.setAttribute("aria-valuenow",Math.round(T));
  $("time").textContent=`${fmt(T)} / ${fmt(TOTAL)}`;
  intro.style.opacity=1-seg(T,2.4,3.8);
  cap.style.opacity=cur===0?seg(T,3,3.9):cur===SCENES.length-1?1-seg(T,TOTAL-2.8,TOTAL-1.8):1;
  const fin=seg(T,TOTAL-2.4,TOTAL-1.2);finale.hidden=fin<=0;finale.style.opacity=fin;
  playBtn.innerHTML=playing?ICON_PAUSE:ICON_PLAY;playBtn.setAttribute("aria-label",playing?"暂停":"播放");
}
let lastIcon=null;
function render(){
  const i=Math.min(SCENES.length-1,Math.floor(T/D)),local=T-i*D;
  setScene(i);
  if(local<X&&i>0){
    const a=ease(local/X);
    drawScene(ctx,i-1,local+D,1+a*.03);
    drawScene(bctx,i,local,1.05-a*.05);
    ctx.setTransform(1,0,0,1,0,0);ctx.globalAlpha=a;ctx.drawImage(buf,0,0);ctx.globalAlpha=1;
  }else drawScene(ctx,i,local);
  updateUI();
}
function seek(t){T=clamp(t,0,TOTAL-.001);if(T>=TOTAL-.01)playing=false;render();}
let prev=performance.now();
function loop(now){
  const dt=clamp((now-prev)/1000,0,.1);prev=now;
  if(playing){T+=dt;if(T>=TOTAL){T=TOTAL-.001;playing=false;}}
  render();requestAnimationFrame(loop);
}
playBtn.addEventListener("click",()=>{if(!playing&&T>=TOTAL-.05)T=0;playing=!playing;});
$("replay").addEventListener("click",()=>{T=0;playing=true;});
let drag=false;
const at=e=>{const r=track.getBoundingClientRect();return clamp((e.clientX-r.left)/r.width)*TOTAL;};
track.addEventListener("pointerdown",e=>{if(e.target.closest(".chap"))return;drag=true;track.setPointerCapture(e.pointerId);seek(at(e));});
track.addEventListener("pointermove",e=>{if(drag)seek(at(e));});
track.addEventListener("pointerup",()=>{drag=false;});
window.addEventListener("keydown",e=>{
  if(e.code==="Space"){e.preventDefault();playBtn.click();}
  else if(e.key==="ArrowRight")seek((Math.floor(T/D)+1)*D+.01);
  else if(e.key==="ArrowLeft")seek(Math.max(0,(Math.ceil(T/D-.2)-1))*D+.01);
});
window.__seek=t=>{playing=false;seek(t);};
requestAnimationFrame(loop);
})();
</script>
