<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Neural Genesis 4K</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  #stage { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  canvas { display: block; width: min(100vw, 177.78vh); height: min(56.25vw, 100vh); }
  #hint {
    position: fixed; left: 16px; top: 14px; color: #9cc8ff; opacity: .75;
    font: 12px/1.6 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    transition: opacity 1.2s; pointer-events: none; white-space: pre;
  }
  #err { position: fixed; inset: 0; display: none; place-items: center; color: #f88; font: 16px system-ui; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="stage"></div>
<div id="hint"></div>
<div id="err">此动画需要 WebGL2 支持 · WebGL2 is required</div>

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';

// ───────────────────────────── config ─────────────────────────────
const qs = new URLSearchParams(location.search);
const W = +qs.get('w') || 3840;          // 4K UHD by default
const H = +qs.get('h') || 2160;
const S = H / 2160;                      // 2D overlay scale (designed at 4K)
const DURATION = 45;                     // seconds, loops
const HIDDEN = [32, 40, 40, 28];
const LAYERS = [144, ...HIDDEN, 10];     // 12×12 pixel input → hidden → 10 classes
const NL = LAYERS.length;
const SPACING = 7.5;
const FOV = 45;
const FREEZE = qs.has('t') ? +qs.get('t') : null;   // ?t=9.5 freezes a single frame

// handwritten input digits (12×12)
const DIGITS = {
  3: ['............', '...######...', '..########..', '..##....###.', '........###.', '.....#####..',
      '.....#####..', '........###.', '..##....###.', '..########..', '...######...', '............'],
  7: ['............', '..########..', '..########..', '.......###..', '......###...', '......##....',
      '.....###....', '.....##.....', '....###.....', '....##......', '....##......', '............'],
  0: ['............', '....####....', '...######...', '..###..###..', '..##....##..', '..##....##..',
      '..##....##..', '..##....##..', '..###..###..', '...######...', '....####....', '............'],
};
// Four "slots" blended on the GPU through uSelIn / uSelOut:
//   0: first (untrained) look at "3"   1: trained on "3"   2: unseen "7"   3: unseen "0"
const SLOT_DIGIT = [3, 3, 7, 0];
const PROBS = [
  [0.03, 0.05, 0.08, 0.41, 0.06, 0.12, 0.04, 0.09, 0.07, 0.05],
  [0.002, 0.003, 0.006, 0.981, 0.001, 0.004, 0.001, 0.001, 0.0005, 0.0005],
  [0.002, 0.011, 0.004, 0.006, 0.003, 0.001, 0.001, 0.964, 0.002, 0.006],
  [0.947, 0.001, 0.004, 0.002, 0.003, 0.009, 0.021, 0.002, 0.008, 0.003],
];
const SLOT_WIN = SLOT_DIGIT;             // the correct (and predicted) class per slot

// ───────────────────────────── renderer ─────────────────────────────
const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: 'high-performance' });
if (!renderer.capabilities.isWebGL2) {
  document.getElementById('err').style.display = 'grid';
  throw new Error('WebGL2 required');
}
renderer.setPixelRatio(1);
renderer.setSize(W, H, false);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.getElementById('stage').appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(FOV, W / H, 0.1, 500);
const POINT_SCALE = H / (2 * Math.tan(THREE.MathUtils.degToRad(FOV / 2)));

// deterministic RNG so every run is identical
let seed = 1337;
const rand = () => ((seed = (seed * 16807) % 2147483647) - 1) / 2147483646;
const gauss = () => Math.sqrt(-2 * Math.log(rand() + 1e-9)) * Math.cos(6.2831853 * rand());

const FONT = '"PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei","Helvetica Neue",Arial,sans-serif';
const MONO = 'ui-monospace,"SF Mono",Menlo,Consolas,"DejaVu Sans Mono",monospace';

// shared GLSL helpers
const GLSL_WOBBLE = /* glsl */`
  vec3 wob(vec3 p, float t) {
    return 0.14 * vec3(sin(t * .70 + p.y * .45 + p.z * .20),
                       sin(t * .90 + p.z * .50 + p.x * .10),
                       sin(t * .80 + p.x * .30 + p.y * .30));
  }`;

// ───────────────────────────── background (nebula + stars) ─────────────────────────────
const bgMat = new THREE.ShaderMaterial({
  glslVersion: THREE.GLSL3,
  depthTest: false, depthWrite: false,
  uniforms: {
    uTime: { value: 0 }, uWarm: { value: 0 }, uFinal: { value: 0 },
    uCamWorld: { value: camera.matrixWorld },
    uProjInv: { value: camera.projectionMatrixInverse },
  },
  vertexShader: /* glsl */`
    out vec2 vNdc;
    void main() { vNdc = position.xy; gl_Position = vec4(position.xy, 0.0, 1.0); }`,
  fragmentShader: /* glsl */`
    precision highp float;
    uniform float uTime, uWarm, uFinal;
    uniform mat4 uCamWorld, uProjInv;
    in vec2 vNdc;
    out vec4 fragColor;
    float hash13(vec3 p) { p = fract(p * .1031); p += dot(p, p.zyx + 31.32); return fract((p.x + p.y) * p.z); }
    float noise(vec3 p) {
      vec3 i = floor(p), f = fract(p); f = f * f * (3. - 2. * f);
      return mix(mix(mix(hash13(i), hash13(i + vec3(1,0,0)), f.x), mix(hash13(i + vec3(0,1,0)), hash13(i + vec3(1,1,0)), f.x), f.y),
                 mix(mix(hash13(i + vec3(0,0,1)), hash13(i + vec3(1,0,1)), f.x), mix(hash13(i + vec3(0,1,1)), hash13(i + vec3(1,1,1)), f.x), f.y), f.z);
    }
    float fbm(vec3 p) { float a = .5, s = 0.; for (int i = 0; i < 4; i++) { s += a * noise(p); p = p * 2.03 + 11.7; a *= .5; } return s; }
    float stars(vec3 d, float scale, float thr) {
      vec3 p = d * scale, id = floor(p), f = fract(p) - .5;
      float h = hash13(id);
      vec3 off = (vec3(hash13(id + 1.3), hash13(id + 2.7), hash13(id + 5.1)) - .5) * .5;
      float s = smoothstep(.16, 0., length(f - off)) * step(thr, h);
      return s * (.55 + .45 * sin(uTime * (2. + h * 4.) + h * 90.));
    }
    void main() {
      vec4 v = uProjInv * vec4(vNdc, 1., 1.); v /= v.w;
      vec3 d = normalize(mat3(uCamWorld) * v.xyz);
      vec3 q = d * 2.2 + vec3(0., 0., uTime * .015);
      float n = fbm(q + fbm(q * 1.7) * 1.2);
      float w = pow(fbm(d * 5. - vec3(uTime * .02)), 3.);
      vec3 deep = vec3(.004, .006, .018);
      vec3 violet = mix(vec3(.05, .018, .11), vec3(.11, .03, .05), uWarm);
      vec3 cyan = mix(vec3(0., .07, .11), vec3(.10, .07, .02), uFinal);
      vec3 col = mix(deep, violet, smoothstep(.35, .8, n)) + cyan * w * 1.6;
      col += vec3(.75, .85, 1.) * (stars(d, 260., .985) * .9 + stars(d, 520., .992) * .5);
      fragColor = vec4(col, 1.);
    }`,
});
const bgGeo = new THREE.BufferGeometry();
bgGeo.setAttribute('position', new THREE.Float32BufferAttribute([-1, -1, 0, 3, -1, 0, -1, 3, 0], 3));
const bg = new THREE.Mesh(bgGeo, bgMat);
bg.frustumCulled = false; bg.renderOrder = -10;
scene.add(bg);

// ───────────────────────────── network topology ─────────────────────────────
const layerX = l => (l - (NL - 1) / 2) * SPACING;
const OUT_X = layerX(NL - 1);
const PIX = 0.75;                         // input pixel pitch
const neurons = [];                       // {pos, layer, idx, vals[4], win[4]}
const byLayer = [];
const pixel = (d, r, c) => {
  const g = DIGITS[d];
  if (g[r][c] === '#') return 0.85 + rand() * 0.15;
  return [[0, 1], [0, -1], [1, 0], [-1, 0]].some(([dr, dc]) => g[r + dr]?.[c + dc] === '#') ? 0.22 : 0;
};
LAYERS.forEach((n, l) => {
  const arr = [];
  for (let i = 0; i < n; i++) {
    let pos, vals = [1, 1, 1, 1], win = [0, 0, 0, 0];
    if (l === 0) {                        // 12×12 image grid, readable from the -x side
      const r = Math.floor(i / 12), c = i % 12;
      pos = new THREE.Vector3(layerX(0), (5.5 - r) * PIX, (c - 5.5) * PIX);
      const p3 = pixel(3, r, c);
      vals = [p3, p3, pixel(7, r, c), pixel(0, r, c)];
    } else if (l === NL - 1) {            // output column, one neuron per digit class
      pos = new THREE.Vector3(OUT_X, (4.5 - i) * 1.5, 0);
      vals = PROBS.map(P => P[i]);
      win = SLOT_WIN.map(w => (w === i ? 1 : 0));
    } else {                              // hidden layers: Fibonacci discs
      const R = 0.95 * Math.sqrt(n) + 0.4;
      const r = R * Math.sqrt((i + 0.5) / n), a = i * 2.399963 + l * 0.7;
      pos = new THREE.Vector3(layerX(l), r * Math.sin(a), r * Math.cos(a));
    }
    const nr = { pos, layer: l, idx: i, vals, win };
    arr.push(nr); neurons.push(nr);
  }
  byLayer.push(arr);
});
const layerTop = byLayer.map(a => Math.max(...a.map(n => n.pos.y)));

// ───────────────────────────── neurons (GPU-driven point sprites) ─────────────────────────────
const uniforms = {
  uTime: { value: 0 }, uAssemble: { value: 0 }, uGrow: { value: 0 }, uInput: { value: 0 }, uBoost: { value: 0 },
  uFwd: { value: -9 }, uFwd2: { value: -9 }, uBwd: { value: 99 }, uBwdT: { value: 99 }, uPulse: { value: 0 },
  uSelIn: { value: new THREE.Vector4(1, 0, 0, 0) }, uSelOut: { value: new THREE.Vector4(1, 0, 0, 0) },
  uFinal: { value: 0 }, uWinner: { value: 0 }, uSparks: { value: 0 }, uBars: { value: 0 },
  uScale: { value: POINT_SCALE }, uNL: { value: NL }, uOutX: { value: OUT_X },
};
{
  const n = neurons.length;
  const pos = new Float32Array(n * 3), start = new Float32Array(n * 3), info = new Float32Array(n * 4), vals = new Float32Array(n * 4), win = new Float32Array(n * 4);
  neurons.forEach((nr, i) => {
    pos.set([nr.pos.x, nr.pos.y, nr.pos.z], i * 3);
    const s = new THREE.Vector3(gauss(), gauss(), gauss()).normalize().multiplyScalar(22 + rand() * 30);
    start.set([s.x, s.y, s.z], i * 3);
    const size = nr.layer === 0 ? 0.62 : nr.layer === NL - 1 ? 0.95 : 0.7;
    info.set([nr.layer, rand(), size, 0], i * 4);
    vals.set(nr.vals, i * 4); win.set(nr.win, i * 4);
  });
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setAttribute('aStart', new THREE.BufferAttribute(start, 3));
  g.setAttribute('aInfo', new THREE.BufferAttribute(info, 4));
  g.setAttribute('aVals', new THREE.BufferAttribute(vals, 4));
  g.setAttribute('aWin', new THREE.BufferAttribute(win, 4));
  const m = new THREE.ShaderMaterial({
    glslVersion: THREE.GLSL3, uniforms,
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
    vertexShader: /* glsl */`
      uniform float uTime, uAssemble, uInput, uBoost, uFwd, uFwd2, uBwd, uBwdT, uPulse, uWinner, uScale, uNL;
      uniform vec4 uSelIn, uSelOut;
      in vec3 aStart; in vec4 aInfo;       // layer, rand, size, -
      in vec4 aVals;                       // per slot: pixel value (input) / class probability (output)
      in vec4 aWin;                        // per slot: is this output neuron the correct class
      out vec3 vColor; out float vRing; out float vAlpha;
      ${GLSL_WOBBLE}
      void main() {
        float L = aInfo.x, r = aInfo.y;
        float p = clamp(uAssemble * 1.7 - r * .7, 0., 1.);
        float e = 1. - pow(1. - p, 4.);
        float ang = (1. - e) * (4. + r * 3.);
        vec3 s = aStart;
        s.xz = mat2(cos(ang), -sin(ang), sin(ang), cos(ang)) * s.xz;
        vec3 pos = mix(s, position, e) + wob(position, uTime) * e;

        float isIn = 1. - step(.5, L), isOut = step(uNL - 1.5, L);
        float val = dot(aVals, isOut > .5 ? uSelOut : uSelIn);
        float gain = mix(1., (.08 + val) * .45, isIn) * mix(1., .2 + .8 * sqrt(val), isOut);
        float strength = mix(.35 + .65 * fract(r * 17.31), 1., isIn + isOut);
        float fw  = exp(-pow((L - uFwd)  * 2.4, 2.)) * strength * gain;
        float fw2 = exp(-pow((L - uFwd2) * 2.4, 2.)) * strength * gain * uPulse;
        float bw  = exp(-pow((L - uBwd)  * 2.4, 2.));
        float trained = clamp(L + .5 - uBwdT, 0., 1.);
        float win = dot(aWin, uSelOut) * uWinner;
        float tw = pow(.5 + .5 * sin(uTime * 2.3 + r * 60.), 12.) * .6;

        vec3 cold = mix(vec3(.10, .45, 1.), vec3(.55, .25, 1.), L / (uNL - 1.));
        vec3 gold = mix(vec3(1., .62, .22), vec3(.25, .95, 1.), .5 + .5 * sin(L * 1.2 + uTime * .8));
        vec3 base = mix(cold, gold, trained);
        base *= mix(1., .3, isIn * uInput) * (1. - .55 * uBoost * (1. - isIn));   // spotlight the input while a new digit lands                      // unlit pixels dim once the image lands
        vec3 col = base * (.4 + tw)
                 + vec3(.8, .95, 1.) * isIn * val * uInput * (.75 + 2.2 * uBoost)   // the digit itself
                 + vec3(.55, .85, 1.) * (fw + fw2) * 1.6
                 + vec3(1., .3, .55) * bw * 1.7
                 + vec3(1., .85, .5) * win * 2.2;
        col = mix(vec3(.6, .85, 1.), col, e);                    // in-flight sparks are white-blue

        float size = aInfo.z * (mix(.35, 1., e) + (fw + fw2) * .9 + bw * .7 + win * 1.6 + isIn * val * uInput * .2);
        vec4 mv = modelViewMatrix * vec4(pos, 1.);
        gl_Position = projectionMatrix * mv;
        gl_PointSize = min(size * uScale / -mv.z, 900.);
        vRing = max(fw + fw2, max(bw, win));
        vAlpha = mix(.45, 1., e);
        vColor = col;
      }`,
    fragmentShader: /* glsl */`
      precision highp float;
      in vec3 vColor; in float vRing; in float vAlpha;
      out vec4 fragColor;
      void main() {
        vec2 c = gl_PointCoord * 2. - 1.;
        float d = length(c);
        if (d > 1.) discard;
        float core = smoothstep(.26, .1, d);
        float glow = exp(-d * d * 9.) * .45;
        float ring = smoothstep(.045, 0., abs(d - .62)) * vRing * .9;
        vec3 col = vColor * (glow + ring) + mix(vColor, vec3(1.), .5) * core;
        fragColor = vec4(col * vAlpha * smoothstep(1., .75, d), 1.);
      }`,
  });
  const pts = new THREE.Points(g, m);
  pts.frustumCulled = false;
  pts.renderOrder = 2;
  scene.add(pts);
}

// ───────────────────────────── synapses (camera-facing ribbons) ─────────────────────────────
let SYNAPSES = 0;
{
  const conns = [];
  for (let l = 0; l < NL - 1; l++) {
    const next = byLayer[l + 1];
    const k = l === 0 ? 8 : Math.min(next.length, 14);
    for (const a of byLayer[l]) {
      const pool = next.slice();
      for (let j = 0; j < k; j++) {
        const b = pool.splice(Math.floor(rand() * pool.length), 1)[0];
        // how much signal this synapse carries: dark pixels send nothing, strong classes pull harder
        const carry = l === 0 ? a.vals.map(v => Math.max(v, 0.04))
          : l === NL - 2 ? b.vals.map(p => 0.2 + 0.8 * Math.sqrt(p)) : [1, 1, 1, 1];
        conns.push([a.pos, b.pos, l, rand(), Math.max(-1, Math.min(1, gauss() * 0.5)), carry]);
      }
    }
  }
  SYNAPSES = conns.length;
  const n = conns.length;
  const A = new Float32Array(n * 12), B = new Float32Array(n * 12), TS = new Float32Array(n * 8), INF = new Float32Array(n * 12), CAR = new Float32Array(n * 16);
  const idx = new Uint32Array(n * 6);
  conns.forEach(([a, b, l, r, w, carry], i) => {
    [[0, -1], [0, 1], [1, -1], [1, 1]].forEach(([t, s], c) => {
      const v = i * 4 + c;
      A.set([a.x, a.y, a.z], v * 3); B.set([b.x, b.y, b.z], v * 3);
      TS.set([t, s], v * 2); INF.set([l, r, w], v * 3); CAR.set(carry, v * 4);
    });
    const o = i * 4;
    idx.set([o, o + 2, o + 1, o + 1, o + 2, o + 3], i * 6);
  });
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(A, 3));   // unused but required
  g.setAttribute('aA', new THREE.BufferAttribute(A, 3));
  g.setAttribute('aB', new THREE.BufferAttribute(B, 3));
  g.setAttribute('aTS', new THREE.BufferAttribute(TS, 2));
  g.setAttribute('aInfo', new THREE.BufferAttribute(INF, 3));
  g.setAttribute('aCarry', new THREE.BufferAttribute(CAR, 4));
  g.setIndex(new THREE.BufferAttribute(idx, 1));
  const m = new THREE.ShaderMaterial({
    glslVersion: THREE.GLSL3,
    uniforms: { ...uniforms, uWidth: { value: 0.032 } },
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, side: THREE.DoubleSide,
    vertexShader: /* glsl */`
      uniform float uTime, uGrow, uWidth;
      uniform vec4 uSelIn, uSelOut;
      in vec3 aA, aB; in vec2 aTS; in vec3 aInfo;   // info: layer, rand, weight
      in vec4 aCarry;                               // per slot: how much signal this synapse carries
      out float vT; out float vSide; out float vG; out vec4 vInfo;
      ${GLSL_WOBBLE}
      void main() {
        float g = clamp(uGrow - aInfo.x - aInfo.y * .6, 0., 1.);
        g = g * g * (3. - 2. * g);
        float t = aTS.x * g;
        vec3 a = aA + wob(aA, uTime), b = aB + wob(aB, uTime);
        vec3 p = mix(a, b, t);
        vec3 side = normalize(cross(normalize(b - a), normalize(cameraPosition - p)));
        p += side * aTS.y * uWidth * (.55 + .9 * abs(aInfo.z));
        vT = t; vSide = aTS.y; vG = g;
        vInfo = vec4(aInfo, dot(aCarry, aInfo.x < .5 ? uSelIn : uSelOut));
        gl_Position = projectionMatrix * modelViewMatrix * vec4(p, 1.);
      }`,
    fragmentShader: /* glsl */`
      precision highp float;
      uniform float uTime, uFwd, uFwd2, uBwd, uBwdT, uPulse, uSparks;
      in float vT; in float vSide; in float vG; in vec4 vInfo;
      out vec4 fragColor;
      void main() {
        if (vG < .001) discard;
        float L = vInfo.x, r = vInfo.y, w = vInfo.z, aw = abs(w), carry = vInfo.w;
        float edge = 1. - abs(vSide); edge *= edge;

        float trained = 1. - smoothstep(L, L + 1., uBwdT);
        vec3 init = w > 0. ? vec3(.15, .6, 1.) : vec3(.6, .22, 1.);
        vec3 gold = mix(vec3(1., .6, .2), vec3(.3, .95, 1.), step(0., w));
        vec3 base = mix(init, gold, trained);
        // training sharpens the weights: strong ones brighten, weak ones fade
        float inten = mix(.018 + .05 * aw, aw > .45 ? .12 : .006, trained);

        float pf  = exp(-pow((vT - (uFwd  - L)) * 7., 2.)) * (.35 + .65 * aw) * carry;
        float pf2 = exp(-pow((vT - (uFwd2 - L)) * 7., 2.)) * (.35 + .65 * aw) * carry * uPulse;
        float pb  = exp(-pow((vT - (uBwd  - L)) * 7., 2.));
        float s   = fract(uTime * (.25 + .35 * r) + r * 7.);
        float ps  = exp(-pow((vT - s) * 40., 2.)) * uSparks * step(.55, fract(r * 23.17)) * carry;
        float tip = smoothstep(vG - .06, vG, vT) * (1. - step(.999, vG)) * 2.5;

        vec3 col = base * inten
                 + vec3(.55, .85, 1.) * (pf + pf2) * .9
                 + vec3(1., .3, .5) * pb * .9
                 + mix(vec3(.5, .85, 1.), vec3(1., .8, .45), trained) * ps * .9
                 + vec3(.6, .9, 1.) * tip * .5;
        fragColor = vec4(col * edge, 1.);
      }`,
  });
  const mesh = new THREE.Mesh(g, m);
  mesh.frustumCulled = false;
  mesh.renderOrder = 1;
  scene.add(mesh);
}

// ───────────────────────────── input data streams (pixels flying onto each digit) ─────────────────────────────
function dataStream(slot, n, tStart, tSpread) {
  const lit = byLayer[0].filter(nr => nr.vals[slot] > 0.5);
  const from = new Float32Array(n * 3), to = new Float32Array(n * 3), info = new Float32Array(n * 2);
  for (let i = 0; i < n; i++) {
    const target = lit[Math.floor(rand() * lit.length)].pos;
    from.set([layerX(0) - 38 - rand() * 30, gauss() * 9, gauss() * 9], i * 3);
    to.set([target.x, target.y, target.z], i * 3);
    info.set([tStart + rand() * tSpread, rand()], i * 2);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(from, 3));
  g.setAttribute('aTo', new THREE.BufferAttribute(to, 3));
  g.setAttribute('aInfo', new THREE.BufferAttribute(info, 2));
  const pts = new THREE.Points(g, streamMat);
  pts.frustumCulled = false;
  pts.renderOrder = 3;
  scene.add(pts);
}
const streamMat = new THREE.ShaderMaterial({
  glslVersion: THREE.GLSL3, uniforms,
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  vertexShader: /* glsl */`
    uniform float uTime, uScale;
    in vec3 aTo; in vec2 aInfo;   // start time, rand
    out float vA; out vec3 vC;

  fragmentShader: /* glsl */`
    precision highp float;
    uniform sampler2D tDiffuse, tHud, tPanel;
    uniform float uTime, uFade, uHud, uPanel, uAberr;
    uniform vec2 uRes;
    uniform vec4 uPanelRect;
    in vec2 vUv;
    out vec4 fragColor;
    float hash(vec2 p) { vec3 p3 = fract(vec3(p.xyx) * .1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y) * p3.z); }
    void main() {
      vec2 c = vUv - .5;
      float ab = uAberr * dot(c, c) * 4.;
      vec3 col = vec3(texture(tDiffuse, vUv - c * ab).r, texture(tDiffuse, vUv).g, texture(tDiffuse, vUv + c * ab).b);
      float vig = smoothstep(1.05, .2, length(c * vec2(1.15, 1.)));
      col *= mix(.5, 1., vig);
      col += (hash(vUv * uRes + fract(uTime * 7.) * 500.) - .5) * .028;

      vec2 hu = vUv + vec2((1. - uHud) * .006, 0.);
      vec4 h = texture(tHud, hu);
      float shade = 0.;                       // soft dark backing so captions stay legible over glow
      for (int i = 0; i < 12; i++) {
        float a = float(i) * .5236;
        shade += texture(tHud, hu + vec2(cos(a), sin(a)) * vec2(.012, .02)).a;
        shade += texture(tHud, hu + vec2(cos(a), sin(a)) * vec2(.028, .045)).a;
      }
      col *= 1. - clamp(shade / 12., 0., 1.) * .6 * uHud;
      col = mix(col, h.rgb, h.a * uHud);

      vec2 pu = (vUv - uPanelRect.xy) / uPanelRect.zw + vec2(0., (1. - uPanel) * .04);
      if (uPanel > 0. && all(greaterThan(pu, vec2(0.))) && all(lessThan(pu, vec2(1.)))) {
        vec4 p = texture(tPanel, pu);
        col = mix(col, p.rgb, p.a * uPanel);
      }
      fragColor = vec4(col * uFade, 1.);
    }`,
}));
composer.addPass(grade);

// ───────────────────────────── camera choreography ─────────────────────────────
const V = (x, y, z) => new THREE.Vector3(x, y, z);
const KEYS = [
  { t: 0.0,  p: V(0, 2, 72),     l: V(0, 0, 0) },
  { t: 3.6,  p: V(-16, 10, 44),  l: V(0, 0, 0) },
  { t: 7.5,  p: V(-43, 2, 5),    l: V(-18, 0, 0) },     // face-on to the input digit
  { t: 9.3,  p: V(-31, 9, 21),   l: V(-10, 0, 0) },
  { t: 10.8, p: V(-2, 15, 27),   l: V(4, 0, 0) },
  { t: 12.9, p: V(21, 3, 30),    l: V(22, 0, 0) },      // face-on to the softmax bars
  { t: 16.2, p: V(6, -13, 36),   l: V(2, 0, 0) },
  { t: 18.8, p: V(36, 10, -8),   l: V(0, 0, 0) },       // training loop: full orbit
  { t: 21.4, p: V(4, 18, -40),   l: V(0, 0, 0) },
  { t: 23.8, p: V(-38, 6, -14),  l: V(0, 0, 0) },
  { t: 25.8, p: V(-34, 10, 22),  l: V(-10, 0, 0) },
  { t: 27.6, p: V(-43, 2, 5),    l: V(-18, 0, 0) },     // unseen "7"
  { t: 29.4, p: V(-2, 15, 27),   l: V(4, 0, 0) },
  { t: 31.4, p: V(21, 3, 30),    l: V(22, 0, 0) },
  { t: 33.2, p: V(-43, 2, 5),    l: V(-18, 0, 0) },     // unseen "0"
  { t: 35.0, p: V(-2, 15, 27),   l: V(4, 0, 0) },
  { t: 37.0, p: V(21, 3, 30),    l: V(22, 0, 0) },
  { t: 40.5, p: V(6, -10, 40),   l: V(4, 0, 0) },
  { t: 45.0, p: V(0, 3, 70),     l: V(2, 0, 0) },
];
function cr(p0, p1, p2, p3, u, out) {
  const u2 = u * u, u3 = u2 * u;
  return out.set(0, 0, 0)
    .addScaledVector(p0, -0.5 * u3 + u2 - 0.5 * u)
    .addScaledVector(p1, 1.5 * u3 - 2.5 * u2 + 1)
    .addScaledVector(p2, -1.5 * u3 + 2 * u2 + 0.5 * u)
    .addScaledVector(p3, 0.5 * u3 - 0.5 * u2);
}
const tmpP = new THREE.Vector3(), tmpL = new THREE.Vector3();
function placeCamera(t) {
  let i = 0;
  while (i < KEYS.length - 2 && t > KEYS[i + 1].t) i++;
  const k0 = KEYS[Math.max(0, i - 1)], k1 = KEYS[i], k2 = KEYS[i + 1], k3 = KEYS[Math.min(KEYS.length - 1, i + 2)];
  const u = Math.min(1, Math.max(0, (t - k1.t) / (k2.t - k1.t)));
  cr(k0.p, k1.p, k2.p, k3.p, u, tmpP);
  cr(k0.l, k1.l, k2.l, k3.l, u, tmpL);
  tmpP.x += Math.sin(t * 0.9) * 0.35; tmpP.y += Math.sin(t * 1.3 + 1) * 0.25;
  camera.position.copy(tmpP);
  camera.up.set(Math.sin(t * 0.35) * 0.06, 1, 0).normalize();
  camera.lookAt(tmpL);
}

// ───────────────────────────── timeline ─────────────────────────────
const clamp01 = x => Math.min(1, Math.max(0, x));
const lin = (a, b, x) => clamp01((x - a) / (b - a));
const sm = (a, b, x) => { const t = lin(a, b, x); return t * t * (3 - 2 * t); };
const GOLD = new THREE.Color(1.0, 0.78, 0.4), WHITE = new THREE.Color(0.85, 0.93, 1.0);

const bump = (a, b, c, d, x) => sm(a, b, x) * (1 - sm(c, d, x));
const sweep = (t, t0, dur) => -0.6 + (t - t0) / dur * (NL + 0.8);       // forward wave, layer units
const sweepBack = (t, t0, dur) => (NL - 0.4) - (t - t0) / dur * (NL + 0.4);
const LOOP_T0 = 16.2, LOOP_N = 6, LOOP_DT = 1.6;                        // training-loop cycles
const FWD_RUNS = [[8.0, 4.8], [28.0, 3.0], [33.6, 3.0]];                // [start, duration]

function update(t) {
  const U = uniforms;
  U.uTime.value = t;
  U.uAssemble.value = lin(0.2, 4.2, t);
  U.uGrow.value = lin(3.4, 7.4, t) * (NL - 0.4);
  U.uInput.value = sm(6.6, 7.6, t);
  U.uBoost.value = bump(26.9, 27.6, 28.6, 29.4, t) + bump(32.5, 33.2, 34.2, 35.0, t);

  // forward / backward waves
  let fwd = -9, bwd = 99;
  for (const [a, d] of FWD_RUNS) if (t >= a && t < a + d + 0.4) fwd = sweep(t, a, d);
  if (t >= 13.2 && t < 16.2) bwd = sweepBack(t, 13.2, 3.0);
  const cyc = (t - LOOP_T0) / LOOP_DT;
  if (cyc >= 0 && cyc < LOOP_N) {
    const ct = LOOP_T0 + Math.floor(cyc) * LOOP_DT;
    if (t < ct + LOOP_DT / 2) fwd = sweep(t, ct, LOOP_DT / 2);
    else bwd = sweepBack(t, ct + LOOP_DT / 2, LOOP_DT / 2);
  }
  U.uFwd.value = fwd;
  U.uBwd.value = bwd;
  U.uBwdT.value = t < 13.2 ? 99 : sweepBack(t, 13.2, 3.0);   // first backprop permanently "trains" the weights

  // which digit is on the input, and which softmax row is on the output
  const k = lin(LOOP_T0, LOOP_T0 + LOOP_N * LOOP_DT, t);    // training progress 41% → 98.1%
  const m7 = sm(26.8, 27.8, t), m0 = sm(32.4, 33.4, t);
  U.uSelIn.value.set((1 - k) * (1 - m7), k * (1 - m7), m7 * (1 - m0), m0);
  const s7 = t >= 27.5 ? 1 : 0, s0 = t >= 33.0 ? 1 : 0;      // switch while the bars are collapsed
  const sel = [(1 - k) * (1 - s7), k * (1 - s7), s7 * (1 - s0), s0];
  U.uSelOut.value.set(...sel);

  U.uFinal.value = sm(37.4, 38.4, t);
  U.uPulse.value = U.uFinal.value;
  U.uFwd2.value = t < 37.4 ? -9 : ((t - 37.4) * 4.5) % (NL + 1.5) - 1.0;
  U.uWinner.value = Math.max(bump(11.8, 12.4, 13.2, 13.8, t), 0.4 * bump(16.2, 17.2, 26.4, 27.0, t),
    bump(30.4, 31.0, 32.2, 32.8, t), bump(36.0, 36.6, 44.5, 45.5, t) * (1 - 0.6 * U.uFinal.value));
  U.uSparks.value = sm(6.5, 8.0, t) * 0.55 + U.uFinal.value * 0.6;
  U.uBars.value = sm(11.9, 12.9, t) * (1 - sm(26.6, 27.2, t)) + bump(30.4, 31.2, 32.2, 32.8, t) + sm(36.0, 36.8, t);

  bgMat.uniforms.uTime.value = t;
  bgMat.uniforms.uWarm.value = bump(13.0, 13.8, 25.4, 26.6, t);
  bgMat.uniforms.uFinal.value = U.uFinal.value;

  // 3D labels
  // hidden while the camera looks down the network's axis (labels would stack up)
  const labelA = Math.max(sm(4.6, 5.6, t) * (1 - sm(6.0, 6.5, t)), sm(8.6, 9.6, t)) * (1 - sm(16.4, 17.4, t)) * 0.9;
  layerLabels.forEach(sp => (sp.material.opacity = labelA));
  const digitA = sm(10.8, 12.0, t) * (0.35 + 0.65 * Math.min(1, U.uBars.value * 1.5));
  digitLabels.forEach((sp, i) => {
    const p = PROBS.reduce((s, P, j) => s + P[i] * sel[j], 0);
    const hot = SLOT_WIN.reduce((s, w, j) => s + (w === i ? sel[j] : 0), 0) * U.uWinner.value;
    sp.material.opacity = digitA * (0.45 + 0.55 * Math.sqrt(p) + hot);
    sp.material.color.copy(WHITE).lerp(GOLD, Math.min(1, hot * 1.5));
  });

  const flash = Math.exp(-Math.pow((t - 13.3) * 3, 2));
  const predict = Math.exp(-Math.pow((t - 12.0) * 4, 2)) + Math.exp(-Math.pow((t - 30.6) * 4, 2)) + Math.exp(-Math.pow((t - 36.2) * 4, 2));
  bloom.strength = 0.75 + 0.2 * U.uFinal.value + 0.25 * flash + 0.1 * predict;
  const gu = grade.uniforms;
  gu.uTime.value = t;
  gu.uFade.value = sm(0, 0.9, t) * (1 - sm(DURATION - 0.9, DURATION, t));
  gu.uAberr.value = 0.006 + 0.03 * flash + 0.012 * predict;

  // captions
  const ci = CAPTIONS.findIndex(c => t >= c.a && t < c.b);
  if (ci !== hudIdx) { hudIdx = ci; drawCaption(CAPTIONS[ci]); }
  const c = CAPTIONS[ci];
  gu.uHud.value = c ? sm(c.a, c.a + 0.6, t) * (1 - sm(c.b - 0.5, c.b, t)) : 0;

  // info panel
  const p = PANELS.find(p => t >= p.a && t < p.b);
  gu.uPanel.value = p ? sm(p.a, p.a + 0.5, t) * (1 - sm(p.b - 0.4, p.b, t)) : 0;
  if (p) { panelRect.x = p.x; p.draw(lin(p.u[0], p.u[1], t), t); }

  placeCamera(t);
}

// ───────────────────────────── loop, restart & 4K recording ─────────────────────────────
const hint = document.getElementById('hint');
hint.textContent = `${W}×${H} · ${DURATION}s loop · WebGL2 / GLSL ES 3.00\n点击重播 · R 录制 WebM · F 全屏 · ?w=1920&h=1080 低配预览`;
setTimeout(() => (hint.style.opacity = 0), 4500);

let t0 = performance.now();
let recorder = null;
function restart() { t0 = performance.now(); }

function startRecording() {
  if (recorder) return;
  const stream = renderer.domElement.captureStream(60);
  const mime = ['video/webm;codecs=vp9', 'video/webm;codecs=vp8', 'video/webm'].find(m => MediaRecorder.isTypeSupported(m));
  recorder = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 80e6 });
  const chunks = [];
  recorder.ondataavailable = e => e.data.size && chunks.push(e.data);
  recorder.onstop = () => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob(chunks, { type: 'video/webm' }));
    a.download = `neural-network-${W}x${H}.webm`;
    a.click();
    recorder = null;
  };
  restart();
  recorder.start();
  hint.textContent = '● REC'; hint.style.opacity = 1;
}

addEventListener('click', restart);
addEventListener('keydown', e => {
  if (e.key === 'r' || e.key === 'R') startRecording();
  if (e.key === 'f' || e.key === 'F') document.documentElement.requestFullscreen?.().catch(() => {});
});

function frame(now) {
  let t = FREEZE ?? (now - t0) / 1000;
  if (recorder && t >= DURATION) { recorder.stop(); hint.style.opacity = 0; }
  t %= DURATION;
  update(t);
  composer.render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
