<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>胶囊笔记</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;500;700;900&family=JetBrains+Mono:wght@500;700&display=swap">
<link rel="stylesheet" href="vendor/framework7.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<!-- 液态玻璃的透镜滤镜由脚本按每块玻璃的尺寸生成，放在这里 -->
<svg class="defs" id="lensDefs" width="0" height="0" aria-hidden="true" focusable="false"></svg>

<div id="app">
  <!-- ========== 侧边栏：Framework7 浮动面板 ========== -->
  <div class="panel panel-left panel-floating" id="sidebar">
    <div class="page">
      <div class="navbar">
        <div class="navbar-bg"></div>
        <div class="navbar-inner">
          <div class="title">胶囊笔记</div>
          <div class="right">
            <a class="link icon-only" id="newDoc" title="新建文档" aria-label="新建文档"><i class="f7-icons">square_pencil</i></a>
          </div>
        </div>
      </div>
      <div class="page-content">
        <form class="searchbar searchbar-inline" id="searchForm" onsubmit="return false">
          <div class="searchbar-inner">
            <div class="searchbar-input-wrap">
              <input type="search" id="search" placeholder="搜索" aria-label="搜索文档" autocomplete="off">
              <i class="searchbar-icon"></i>
              <span class="input-clear-button"></span>
            </div>
          </div>
        </form>
        <div class="block-title side-title">文档<span id="docCount"></span></div>
        <div class="list list-strong-ios list-dividers-ios inset doc-list" id="docList"><ul></ul></div>
        <div class="block-footer side-foot">向左滑动文档可以删除，右键可以重命名或删除。文档只保存在当前浏览器里。</div>
      </div>
    </div>
  </div>

  <canvas class="wallpaper" id="wallpaper" aria-hidden="true"></canvas>
  <div class="veil" aria-hidden="true"></div>

  <!-- ========== 正文：直接在排好版的文档上编辑 ========== -->
  <main class="screen" id="scroller">
    <div class="column">
      <section class="card" id="card">
        <h1 class="large-title" id="docTitle" contenteditable="plaintext-only" spellcheck="false" aria-label="文档标题"></h1>
        <p class="meta" id="status"></p>
        <article class="doc" id="doc" contenteditable="true" spellcheck="false" aria-label="文档内容" role="textbox" aria-multiline="true"></article>
      </section>
    </div>
  </main>

  <!-- 顶部：悬浮玻璃按钮 -->
  <header class="topbar">
    <div class="glass group">
      <button class="gbtn" id="sidebarBtn" type="button" aria-label="显示或隐藏文档列表" title="文档列表"><i class="f7-icons">rectangle_stack</i></button>
    </div>
    <div class="topbar-right">
      <div class="glass group">
        <button class="gbtn" id="rerollBtn" type="button" aria-label="全部重新随机" title="全部重新随机"><i class="f7-icons">shuffle</i></button>
        <button class="gbtn" id="undo" type="button" aria-label="撤销" title="撤销（⌘Z）"><i class="f7-icons">arrow_uturn_left</i></button>
        <button class="gbtn" id="redo" type="button" aria-label="重做" title="重做（⇧⌘Z）"><i class="f7-icons">arrow_uturn_right</i></button>
        <button class="gbtn" id="moreBtn" type="button" aria-label="更多" title="更多"><i class="f7-icons">ellipsis</i></button>
      </div>
    </div>
  </header>

  <!-- 底部：备忘录式的玻璃工具条 -->
  <nav class="bottombar glass" id="bottombar" aria-label="插入与格式">
    <button class="gbtn" type="button" id="fmtBtn" aria-label="文字格式" title="文字格式"><span class="aa">Aa</span></button>
    <button class="gbtn" type="button" data-cmd="ul" aria-label="项目符号列表" title="项目符号列表"><i class="f7-icons">list_bullet</i></button>
    <button class="gbtn" type="button" data-cmd="task" aria-label="清单" title="清单"><i class="f7-icons">checkmark_circle</i></button>
    <button class="gbtn" type="button" data-cmd="table" aria-label="表格" title="插入表格"><i class="f7-icons">table</i></button>
    <span class="bsep" aria-hidden="true"></span>
    <button class="add-cap" type="button" id="addCap" title="在光标处插入胶囊"><i class="f7-icons">plus</i><span>胶囊</span></button>
  </nav>

  <div class="tip" id="tip" role="tooltip" hidden></div>
</div>

<script src="vendor/framework7.js"></script>
<script src="js/markdown.js"></script>
<script src="js/expr.js"></script>
<script src="js/app.js"></script>
</body>
</html>
