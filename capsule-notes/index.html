<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>胶囊笔记</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@700&family=JetBrains+Mono:wght@500;600&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app" id="app" data-mode="view">
  <aside class="side" id="side" aria-label="文档列表">
    <div class="brand"><span class="brand-pill" aria-hidden="true"></span>胶囊笔记</div>
    <button class="btn btn-primary btn-block" id="newDoc" type="button">＋ 新建文档</button>
    <nav class="doc-list" id="docList"></nav>
    <p class="side-foot">文档只保存在当前浏览器里。</p>
  </aside>
  <div class="scrim" id="scrim" hidden></div>

  <main class="main">
    <header class="top">
      <button class="icon-btn menu-btn" id="menu" type="button" aria-label="打开文档列表">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 5h14M3 10h14M3 15h14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
      <input class="title-input" id="title" aria-label="文档标题" maxlength="80">
      <div class="seg" role="group" aria-label="模式">
        <button type="button" data-set-mode="view" aria-pressed="true">浏览</button>
        <button type="button" data-set-mode="edit" aria-pressed="false">编辑</button>
      </div>
    </header>

    <div class="bar" id="toolbar" role="toolbar" aria-label="编辑工具">
      <div class="tool-group">
        <button type="button" class="tool" data-md="bold" title="粗体"><b>B</b></button>
        <button type="button" class="tool" data-md="italic" title="斜体"><i>I</i></button>
        <button type="button" class="tool" data-md="strike" title="删除线"><s>S</s></button>
        <button type="button" class="tool" data-md="code" title="行内代码">&lt;/&gt;</button>
      </div>
      <div class="tool-group">
        <button type="button" class="tool" data-md="h2" title="标题">H</button>
        <button type="button" class="tool" data-md="ul" title="无序列表">•</button>
        <button type="button" class="tool" data-md="ol" title="有序列表">1.</button>
        <button type="button" class="tool" data-md="task" title="任务列表">☐</button>
        <button type="button" class="tool" data-md="quote" title="引用">❝</button>
      </div>
      <div class="tool-group">
        <button type="button" class="tool" data-md="link" title="链接">链接</button>
        <button type="button" class="tool" data-md="table" title="插入表格">表格</button>
        <button type="button" class="tool" data-md="hr" title="分割线">—</button>
      </div>
      <button type="button" class="btn btn-primary insert-btn" id="insertCap" title="在光标处插入胶囊">
        <span class="mini-pill" aria-hidden="true"></span>插入胶囊
      </button>
    </div>

    <div class="bar" id="viewbar">
      <button type="button" class="btn" id="rerollAll">
        <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="2" y="2" width="12" height="12" rx="3" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="5.5" cy="5.5" r="1.1" fill="currentColor"/><circle cx="8" cy="8" r="1.1" fill="currentColor"/><circle cx="10.5" cy="10.5" r="1.1" fill="currentColor"/></svg>
        全部重新随机
      </button>
      <label class="toggle"><input type="checkbox" id="showFx"> 显示公式</label>
      <span class="summary" id="summary"></span>
    </div>

    <div class="page">
      <article class="doc" id="view"></article>
      <div class="doc editor" id="editor" spellcheck="false" aria-label="文档内容（Markdown）" role="textbox" aria-multiline="true"></div>
    </div>
    <footer class="status" id="status"></footer>
  </main>
</div>

<dialog class="dlg" id="dlg" aria-labelledby="dlgTitle"></dialog>
<div class="pop" id="pop" role="dialog" hidden></div>

<script src="js/markdown.js"></script>
<script src="js/expr.js"></script>
<script src="js/app.js"></script>
</body>
</html>
