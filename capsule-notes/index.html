<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>胶囊笔记</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@400&family=JetBrains+Mono:wght@500;700&display=swap">
<link rel="stylesheet" href="vendor/shoelace-dark.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<script>document.documentElement.classList.add("sl-theme-dark");</script>

<canvas class="backdrop" id="backdrop" aria-hidden="true"></canvas>
<div class="veil" aria-hidden="true"></div>

<div class="app" id="app" data-mode="view">
  <header class="topbar">
    <div class="tb-left">
      <sl-tooltip content="我的文档" placement="bottom">
        <button class="icon-btn" id="docsBtn" type="button" aria-label="打开文档列表">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
        </button>
      </sl-tooltip>
      <input class="title-input" id="title" aria-label="文档标题" maxlength="80">
    </div>
    <div class="tb-right">
      <div class="seg" role="group" aria-label="模式">
        <button type="button" data-set-mode="edit" aria-pressed="false">编辑</button>
        <button type="button" data-set-mode="view" aria-pressed="true">浏览</button>
      </div>
      <span class="vsep" aria-hidden="true"></span>
      <sl-tooltip content="撤销（Ctrl+Z）" placement="bottom">
        <button class="icon-btn" id="undo" type="button" aria-label="撤销">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>
        </button>
      </sl-tooltip>
      <sl-tooltip content="重做（Ctrl+Shift+Z）" placement="bottom">
        <button class="icon-btn" id="redo" type="button" aria-label="重做">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 14 5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></svg>
        </button>
      </sl-tooltip>
      <span class="vsep" aria-hidden="true"></span>
      <sl-tooltip content="全部重新随机" placement="bottom" class="view-only">
        <button class="icon-btn" id="rerollAll" type="button" aria-label="全部重新随机">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="3.5" width="17" height="17" rx="4"/><circle cx="8.5" cy="8.5" r="1.2" class="fill"/><circle cx="12" cy="12" r="1.2" class="fill"/><circle cx="15.5" cy="15.5" r="1.2" class="fill"/></svg>
        </button>
      </sl-tooltip>
      <sl-tooltip content="在胶囊里显示公式" placement="bottom" class="view-only">
        <button class="icon-btn fx-btn" id="showFx" type="button" aria-label="显示公式" aria-pressed="false"><span aria-hidden="true">ƒ</span></button>
      </sl-tooltip>
      <sl-tooltip content="使用说明" placement="bottom">
        <button class="icon-btn" id="helpBtn" type="button" aria-label="使用说明">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.2 9.2a2.9 2.9 0 0 1 5.6 1c0 1.9-2.8 2.6-2.8 2.6"/><path d="M12 16.8h.01"/></svg>
        </button>
      </sl-tooltip>
    </div>
  </header>

  <main class="stage">
    <div class="toolbar" id="toolbar" role="toolbar" aria-label="编辑工具">
      <button type="button" class="tool" data-md="bold" title="粗体（Ctrl+B）"><b>B</b></button>
      <button type="button" class="tool" data-md="italic" title="斜体（Ctrl+I）"><i>I</i></button>
      <button type="button" class="tool" data-md="strike" title="删除线"><s>S</s></button>
      <button type="button" class="tool" data-md="code" title="行内代码">&lt;/&gt;</button>
      <span class="tsep" aria-hidden="true"></span>
      <button type="button" class="tool" data-md="h2" title="标题">H</button>
      <button type="button" class="tool" data-md="ul" title="无序列表">•</button>
      <button type="button" class="tool" data-md="ol" title="有序列表">1.</button>
      <button type="button" class="tool" data-md="task" title="任务列表">☐</button>
      <button type="button" class="tool" data-md="quote" title="引用">❝</button>
      <span class="tsep" aria-hidden="true"></span>
      <button type="button" class="tool" data-md="link" title="链接">链接</button>
      <button type="button" class="tool" data-md="table" title="插入表格">表格</button>
      <button type="button" class="tool" data-md="hr" title="分割线">—</button>
      <span class="tsep" aria-hidden="true"></span>
      <button type="button" class="insert-btn" id="insertCap" title="在光标处插入胶囊"><span class="mini-pill" aria-hidden="true"></span>插入胶囊</button>
    </div>

    <article class="card">
      <div class="doc" id="view"></div>
      <div class="doc editor" id="editor" spellcheck="false" aria-label="文档内容（Markdown）" role="textbox" aria-multiline="true"></div>
    </article>
    <footer class="status" id="status"></footer>
  </main>
</div>

<sl-drawer id="docsDrawer" label="我的文档" placement="start" class="glass-drawer">
  <nav class="doc-list" id="docList" aria-label="文档列表"></nav>
  <div slot="footer" class="drawer-foot">
    <sl-button variant="primary" id="newDoc">新建文档</sl-button>
    <p>文档只保存在当前浏览器里。</p>
  </div>
</sl-drawer>

<sl-dialog id="capDlg" label="编辑胶囊" class="glass-dialog"></sl-dialog>

<sl-dialog id="helpDlg" label="使用说明" class="glass-dialog">
  <div class="help">
    <p>文档用 Markdown 书写，文中的<b>胶囊</b>是会变化的数字。</p>
    <dl>
      <dt><span class="pill demo" data-color="amber"><span class="lb">随机</span><b class="v">7</b></span></dt>
      <dd>在区间内随机取数。浏览时点一下重新抽取，右上角的骰子会让全部随机胶囊一起重抽。</dd>
      <dt><span class="pill demo" data-color="sky"><span class="lb">填写</span><b class="v">36.0</b><span class="u">g</span></span></dt>
      <dd>由读者自己填。浏览时点开输入数字或拖动滑块，超出区间会自动调整到边界。</dd>
      <dt><span class="pill demo" data-kind="formula" data-color="rose"><span class="lb">公式</span><b class="v">19.0</b><span class="u">%</span></span></dt>
      <dd>用其它胶囊的名字写公式，例如 <code>液重 * 浓度 / 粉量</code>。虚线框表示它是算出来的，点开能看到代入后的算式。</dd>
    </dl>
    <p>切到「编辑」后，把光标放在想要的位置点「插入胶囊」；点击已有胶囊可以修改名称、区间、公式、单位和颜色。</p>
    <p class="keys"><kbd>Ctrl/⌘ E</kbd> 切换模式　<kbd>Ctrl/⌘ Z</kbd> 撤销　<kbd>Ctrl/⌘ ⇧ Z</kbd> 重做</p>
  </div>
</sl-dialog>

<div class="pop" id="pop" role="dialog" hidden></div>

<script src="vendor/shoelace.js"></script>
<script src="js/markdown.js"></script>
<script src="js/expr.js"></script>
<script src="js/app.js"></script>
</body>
</html>
